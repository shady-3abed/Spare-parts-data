# Regenerate the dashboard data whenever the workbook is updated.
name: Update dashboard data

'on':
  push:
    paths:
      - 'workbook/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install openpyxl pandas

      - name: Regenerate website_data.json
        run: python scripts/build_data.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add website_data.json csv-exports/
          git diff --cached --quiet || git commit -m "Update dashboard data from workbook"
          git push
